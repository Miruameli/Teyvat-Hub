name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  structure:
    name: Structure Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the structural rules
        run: node scripts/check-structure.mjs

      - name: Test the structure checks
        run: node --test scripts/structure/tests/*.test.mjs

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Place APK at repository root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./TeyvatHub-debug.apk
          ls -lh ./TeyvatHub-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeyvatHub-debug-apk
          path: TeyvatHub-debug.apk
          retention-days: 7

      - name: Upload raw build output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Signing inputs arrive from GitHub Secrets. When the secrets are absent
      # the build stays unsigned rather than silently using a debug key.
      - name: Build release APK
        env:
          TEYVAT_KEYSTORE_PATH: ${{ secrets.TEYVAT_KEYSTORE_PATH }}
          TEYVAT_KEYSTORE_PASSWORD: ${{ secrets.TEYVAT_KEYSTORE_PASSWORD }}
          TEYVAT_KEY_ALIAS: ${{ secrets.TEYVAT_KEY_ALIAS }}
          TEYVAT_KEY_PASSWORD: ${{ secrets.TEYVAT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # An unsigned release APK means the signing secrets are not configured
      # yet, which is a documented state; a signature that exists but is
      # invalid means something actually went wrong and must fail the build.
      - name: Verify the APK signature
        env:
          TEYVAT_KEYSTORE_PATH: ${{ secrets.TEYVAT_KEYSTORE_PATH }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # apksigner is not on PATH by default; it ships with build-tools,
          # which the SDK setup step installs.
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::warning::apksigner not found, signature not verified"
            exit 0
          fi
          if "$APKSIGNER" verify --print-certs "$APK"; then
            echo "release APK is signed and verifiable"
          elif [ -z "$TEYVAT_KEYSTORE_PATH" ]; then
            echo "::notice::no signing secrets configured, APK stays unsigned"
          else
            echo "::error::signing secrets are configured but the APK is not signed"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TeyvatHub-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Collect release artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./TeyvatHub-debug.apk
          node scripts/generate-sbom.mjs ./TeyvatHub-debug.apk.sbom.json
          sha256sum TeyvatHub-debug.apk > TeyvatHub-debug.apk.sha256
          cat TeyvatHub-debug.apk.sha256
          ls -lh TeyvatHub-debug.apk TeyvatHub-debug.apk.sbom.json TeyvatHub-debug.apk.sha256

      # The signing key is owner material. When the secret is absent the
      # package is published unsigned rather than with a bogus signature, and
      # the notice says exactly that.
      - name: Import the signing key
        if: ${{ secrets.TEYVAT_GPG_PRIVATE_KEY != '' }}
        env:
          TEYVAT_GPG_PRIVATE_KEY: ${{ secrets.TEYVAT_GPG_PRIVATE_KEY }}
          TEYVAT_GPG_KEY_ID: ${{ secrets.TEYVAT_GPG_KEY_ID }}
        run: |
          printf '%s\n' "$TEYVAT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "${TEYVAT_GPG_KEY_ID}:6:" | gpg --import-ownertrust
          gpg --list-secret-keys --keyid-format LONG

      - name: Sign the release package
        env:
          TEYVAT_GPG_KEY_ID: ${{ secrets.TEYVAT_GPG_KEY_ID }}
        run: |
          if [ -z "$TEYVAT_GPG_KEY_ID" ]; then
            echo "::notice::no GPG key configured, package is published unsigned"
            exit 0
          fi
          gpg --batch --yes --detach-sign --armor \
            --local-user "$TEYVAT_GPG_KEY_ID" --output TeyvatHub-debug.apk.sig \
            TeyvatHub-debug.apk
          gpg --batch --verify TeyvatHub-debug.apk.sig TeyvatHub-debug.apk
          echo "signature created and verified locally"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: TeyvatHub-release-package
          path: |
            TeyvatHub-debug.apk
            TeyvatHub-debug.apk.sha256
            TeyvatHub-debug.apk.sbom.json
            TeyvatHub-debug.apk.sig
          retention-days: 30

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/index.html
          retention-days: 7